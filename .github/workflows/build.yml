name: Build desktop prototypes

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "pyproject.toml"
      - "uv.lock"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "licenses/**"
      - ".gitattributes"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "pyproject.toml"
      - "uv.lock"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "licenses/**"
      - ".gitattributes"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      verify_source_replacement:
        description: Rebuild the pinned SDK and verify a separate private copy (JSON evidence only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            runner: windows-2025
            python-arch: x64
          - label: macos-arm64
            runner: macos-15
            python-arch: arm64
          - label: macos-x64
            runner: macos-15-intel
            python-arch: x64
    defaults:
      run:
        shell: bash
    env:
      UV_PYTHON_DOWNLOADS: never
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python-arch }}

      - name: Install locked build dependencies
        run: |
          python -m pip install uv==0.12.9
          uv sync --locked --extra build --extra recognition --python 3.12

      - name: Run safety and packaging tests
        run: uv run --locked --extra build --extra recognition python -m unittest discover -s tests -v

      - name: Compile source
        run: uv run --locked --extra build --extra recognition python -m compileall -q src tests tools

      - name: Smoke-test local WebView launcher with no input
        timeout-minutes: 1
        run: uv run --locked --extra build --extra recognition python -m afk_grinder --ui-smoke

      - name: Smoke-test UI with fake input only
        run: >-
          uv run --locked --extra build --extra recognition python -c
          'import faulthandler, runpy; faulthandler.dump_traceback_later(60, exit=True);
          runpy.run_path("tools/smoke_ui.py", run_name="__main__")'

      - name: Smoke-test recognition setup with fake frames only
        run: >-
          uv run --locked --extra build --extra recognition python -c
          'import faulthandler, runpy; faulthandler.dump_traceback_later(60, exit=True);
          runpy.run_path("tools/smoke_recognition_ui.py", run_name="__main__")'

      - name: Check local SDK without screen capture or input
        run: uv run --locked --extra build --extra recognition python -m afk_grinder --sdk-check

      - name: Build SDK diagnostic bundle for CI verification only
        run: uv run --locked --extra build --extra recognition python tools/build.py --with-recognition

      - name: Check frozen SDK without publishing its bundle
        run: uv run --locked --extra build --extra recognition python tools/check_build.py --recognition

      - name: Record private SDK bundle contents without publishing binaries
        run: >-
          uv run --locked --extra build --extra recognition python -m tools.inventory_build
          --label '${{ matrix.label }}' --commit "$GITHUB_SHA"
          --output build-evidence/sdk-inventory.json --require-sdk

      - name: Prepare pinned source archives for SDK notice traceability
        run: >-
          uv run --locked --extra build --extra recognition python -m tools.fetch_sdk_sources
          --destination build/sdk-traceability-sources

      - name: Bind SDK native files to notices and pinned source recipes
        run: >-
          uv run --locked --extra build --extra recognition python -m tools.sdk_native_provenance
          --inventory build-evidence/sdk-inventory.json --sources build/sdk-traceability-sources
          --label '${{ matrix.label }}' --commit "$GITHUB_SHA"
          --output build-evidence/sdk-native-provenance.json

      - name: Upload SDK native notice traceability as JSON only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SDK-traceability-${{ matrix.label }}-${{ github.sha }}
          path: build-evidence/sdk-native-provenance.json
          if-no-files-found: error
          retention-days: 14

      - name: Verify source-built SDK replacement in a private copy
        if: github.event_name == 'workflow_dispatch' && inputs.verify_source_replacement
        timeout-minutes: 17
        run: |
          if [ '${{ matrix.label }}' = 'windows-x64' ]; then
            sdk_bundle='dist/AFKGrinder'
          else
            sdk_bundle='dist/AFKGrinder.app'
          fi
          uv run --locked --extra build --extra recognition python -m tools.verify_sdk_replacement \
            --label '${{ matrix.label }}' --commit "$GITHUB_SHA" --bundle "$sdk_bundle" \
            --work 'build/sdk-source-replacement-${{ matrix.label }}' \
            --output build-evidence/sdk-replacement.json

      - name: Rebuild downloadable prototype without optional SDK
        run: uv run --locked --extra build --extra recognition python tools/build.py

      - name: Smoke-test packaged application without game input
        run: uv run --locked --extra build --extra recognition python tools/check_build.py

      - name: Package test download with source metadata and checksum
        run: >-
          uv run --locked --extra build --extra recognition python tools/package_build.py
          --label '${{ matrix.label }}' --commit "$GITHUB_SHA"

      - name: Upload test artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AFKGrinder-${{ matrix.label }}-${{ github.sha }}
          path: artifact-output/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload SDK inventory evidence as JSON only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SDK-inventory-${{ matrix.label }}-${{ github.sha }}
          path: build-evidence/sdk-inventory.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload source replacement evidence as JSON only
        if: github.event_name == 'workflow_dispatch' && inputs.verify_source_replacement
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SDK-replacement-${{ matrix.label }}-${{ github.sha }}
          path: build-evidence/sdk-replacement.json
          if-no-files-found: error
          retention-days: 14
