[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "afk-grinder"
version = "0.1.0"
description = "Supervised Windows/macOS input safety prototype for Roblox"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*"]
requires-python = ">=3.11"
dependencies = [
  "pyobjc-framework-ApplicationServices>=11,<13; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=11,<13; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=11,<13; sys_platform == 'darwin'",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
recognition = ["MaaFw==5.14.3"]
build = ["pyinstaller>=6.10,<7"]

[project.scripts]
afk-grinder = "afk_grinder.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
