[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "afk-grinder"
version = "0.2.0"
description = "Local Windows/macOS game launcher with supervised Roblox input checks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*"]
requires-python = ">=3.11"
dependencies = [
  "Pillow==13.0.0",
  "pyobjc-framework-ApplicationServices>=11,<13; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=11,<13; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=11,<13; sys_platform == 'darwin'",
  "pyobjc-framework-ScreenCaptureKit>=11,<13; sys_platform == 'darwin'",
  "pywebview==6.2.1",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
recognition = ["MaaFw==5.14.3"]
build = ["pyinstaller>=6.10,<7"]

[project.scripts]
afk-grinder = "afk_grinder.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
afk_grinder = ["web/*.html", "web/*.css", "web/*.js", "web/assets/*.png"]
